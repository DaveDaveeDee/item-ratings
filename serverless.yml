service: item-ratings

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-north-1
  stage: dev
  environment:
    NODE_OPTIONS: "--enable-source-maps"

functions:
  healthCheck:
    handler: src/api/health.handler
    events:
      - httpApi:
          path: /health
          method: GET
